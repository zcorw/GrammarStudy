<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索结果 - 日语文法学习</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-content">
                <a href="index.html" class="logo">📚 日语文法</a>
                <nav class="nav">
                    <a href="my-grammar.html" class="nav-link" id="myGrammarLink" style="display: none;">我的文法</a>
                    <button class="btn-login" id="loginBtn">登录</button>
                    <span class="user-info" id="userInfo" style="display: none;">
                        <span id="userEmail"></span>
                        <button class="btn-logout" id="logoutBtn">退出</button>
                    </span>
                </nav>
            </div>
        </header>

        <main class="main-content">
            <div class="search-result-container">
                <!-- Search bar -->
                <div class="search-bar-compact">
                    <input
                        type="text"
                        class="search-input"
                        id="searchInput"
                        placeholder="输入文法关键词或句型"
                    >
                    <button class="btn-search" id="searchBtn">🔍</button>
                </div>

                <!-- Search info -->
                <div class="search-info" id="searchInfo"></div>

                <!-- Grammar card display -->
                <div class="grammar-display" id="grammarDisplay">
                    <!-- Main grammar card -->
                    <div class="swipe-hint">← 左右滑动查看相近文法 →</div>

                    <div class="grammar-carousel" id="grammarCarousel">
                        <!-- Grammar cards will be inserted here -->
                    </div>

                    <div class="carousel-indicators" id="carouselIndicators"></div>
                </div>

                <!-- Action buttons -->
                <div class="action-buttons" id="actionButtons">
                    <button class="btn-primary btn-large" id="startLearningBtn">开始学习</button>
                    <button class="btn-secondary btn-large" id="favoriteBtn">
                        <span id="favoriteIcon">☆</span> 收藏
                    </button>
                    <button class="btn-outline btn-large" id="continueCreateBtn" style="display: none;">
                        继续创建新文法
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        let currentIndex = 0;
        let searchResults = [];

        document.addEventListener('DOMContentLoaded', function() {
            initAuth();

            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');

            if (query) {
                document.getElementById('searchInput').value = query;
                performSearch(query);
            }

            // Search button
            document.getElementById('searchBtn').addEventListener('click', function() {
                const newQuery = document.getElementById('searchInput').value.trim();
                if (newQuery) {
                    window.location.href = `search.html?q=${encodeURIComponent(newQuery)}`;
                }
            });

            // Start learning button
            document.getElementById('startLearningBtn').addEventListener('click', function() {
                if (searchResults.length > 0) {
                    const currentGrammar = searchResults[currentIndex];
                    window.location.href = `grammar.html?id=${currentGrammar.id}`;
                }
            });

            // Favorite button
            document.getElementById('favoriteBtn').addEventListener('click', toggleFavorite);

            // Continue create button
            document.getElementById('continueCreateBtn').addEventListener('click', function() {
                const query = document.getElementById('searchInput').value.trim();
                window.location.href = `create.html?q=${encodeURIComponent(query)}`;
            });

            // Touch swipe support
            setupSwipeGestures();
        });

        function performSearch(query) {
            const results = searchGrammar(query);
            searchResults = results.similar_cards || [];

            const searchInfo = document.getElementById('searchInfo');

            if (results.best_match) {
                searchResults.unshift(results.best_match);
                searchInfo.innerHTML = `
                    <p class="search-query">搜索：<strong>${query}</strong></p>
                    <p class="search-confidence">找到 ${searchResults.length} 个相关文法</p>
                `;
            } else {
                searchInfo.innerHTML = `
                    <p class="search-query">搜索：<strong>${query}</strong></p>
                    <p class="search-no-result">未找到完全匹配的文法</p>
                `;
            }

            if (results.should_offer_ai_generation && isLoggedIn()) {
                document.getElementById('continueCreateBtn').style.display = 'block';
            }

            displayGrammarCards();
            updateFavoriteButton();
        }

        function displayGrammarCards() {
            const carousel = document.getElementById('grammarCarousel');
            const indicators = document.getElementById('carouselIndicators');

            if (searchResults.length === 0) {
                carousel.innerHTML = '<div class="no-results">未找到相关文法</div>';
                return;
            }

            carousel.innerHTML = searchResults.map((grammar, index) => `
                <div class="grammar-card-full ${index === currentIndex ? 'active' : ''}" data-index="${index}">
                    <div class="grammar-header">
                        <h2 class="grammar-title-large">${grammar.title}</h2>
                        <span class="grammar-level-badge">${grammar.level}</span>
                    </div>

                    <div class="grammar-section">
                        <h3 class="section-label">含义</h3>
                        <p class="section-content">${grammar.meaning}</p>
                    </div>

                    <div class="grammar-section">
                        <h3 class="section-label">接续</h3>
                        <p class="section-content">${grammar.connection}</p>
                    </div>

                    <div class="grammar-section">
                        <h3 class="section-label">例句</h3>
                        <div class="examples">
                            ${grammar.examples.map(ex => `
                                <div class="example-item">
                                    <p class="example-jp">${ex.japanese}</p>
                                    <p class="example-cn">${ex.chinese}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="grammar-tags">
                        ${grammar.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                </div>
            `).join('');

            // Indicators
            if (searchResults.length > 1) {
                indicators.innerHTML = searchResults.map((_, index) => `
                    <span class="indicator ${index === currentIndex ? 'active' : ''}" data-index="${index}"></span>
                `).join('');

                // Add click handlers to indicators
                indicators.querySelectorAll('.indicator').forEach(indicator => {
                    indicator.addEventListener('click', function() {
                        currentIndex = parseInt(this.dataset.index);
                        updateCarousel();
                    });
                });
            }
        }

        function setupSwipeGestures() {
            const carousel = document.getElementById('grammarCarousel');
            let startX = 0;
            let currentX = 0;

            carousel.addEventListener('touchstart', function(e) {
                startX = e.touches[0].clientX;
            });

            carousel.addEventListener('touchmove', function(e) {
                currentX = e.touches[0].clientX;
            });

            carousel.addEventListener('touchend', function() {
                const diff = startX - currentX;

                if (Math.abs(diff) > 50) {
                    if (diff > 0 && currentIndex < searchResults.length - 1) {
                        currentIndex++;
                        updateCarousel();
                    } else if (diff < 0 && currentIndex > 0) {
                        currentIndex--;
                        updateCarousel();
                    }
                }
            });
        }

        function updateCarousel() {
            const cards = document.querySelectorAll('.grammar-card-full');
            const indicators = document.querySelectorAll('.indicator');

            cards.forEach((card, index) => {
                card.classList.toggle('active', index === currentIndex);
            });

            indicators.forEach((indicator, index) => {
                indicator.classList.toggle('active', index === currentIndex);
            });

            updateFavoriteButton();
        }

        function toggleFavorite() {
            if (!isLoggedIn()) {
                alert('请先登录后再收藏');
                window.location.href = 'login.html';
                return;
            }

            const currentGrammar = searchResults[currentIndex];
            const favorites = getFavorites();
            const index = favorites.indexOf(currentGrammar.id);

            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(currentGrammar.id);
            }

            saveFavorites(favorites);
            updateFavoriteButton();
        }

        function updateFavoriteButton() {
            if (searchResults.length === 0) return;

            const currentGrammar = searchResults[currentIndex];
            const favorites = getFavorites();
            const isFavorited = favorites.includes(currentGrammar.id);

            document.getElementById('favoriteIcon').textContent = isFavorited ? '★' : '☆';
        }
    </script>
</body>
</html>
