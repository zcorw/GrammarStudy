<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 日语文法学习</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-content">
                <a href="index.html" class="logo">📚 日语文法</a>
            </div>
        </header>

        <main class="main-content">
            <div class="login-container">
                <div class="login-card">
                    <h1 class="login-title">登录账号</h1>
                    <p class="login-subtitle">登录后可创建文法、使用AI点评、同步学习数据</p>

                    <form class="login-form" id="loginForm">
                        <div class="input-group">
                            <label class="input-label">邮箱地址</label>
                            <input
                                type="email"
                                class="input-large"
                                id="emailInput"
                                placeholder="请输入您的邮箱"
                                required
                            >
                        </div>

                        <div class="input-group">
                            <label class="input-label">
                                邀请码（可选）
                                <span class="input-hint-inline">有邀请码可直接登录</span>
                            </label>
                            <input
                                type="text"
                                class="input-large"
                                id="inviteCodeInput"
                                placeholder="请输入邀请码（如有）"
                            >
                        </div>

                        <div class="login-notice">
                            <p>📌 首次登录说明：</p>
                            <ul>
                                <li>如有邀请码，提交后可直接使用</li>
                                <li>无邀请码时，需等待管理员审核通过</li>
                                <li>首版暂不需要邮箱验证</li>
                            </ul>
                        </div>

                        <button type="submit" class="btn-primary btn-large btn-full">
                            登录 / 注册
                        </button>
                    </form>

                    <div class="login-footer">
                        <a href="index.html" class="link-secondary">← 返回首页</a>
                    </div>
                </div>

                <!-- Pending approval message -->
                <div class="approval-card" id="approvalCard" style="display: none;">
                    <div class="approval-icon">⏳</div>
                    <h2 class="approval-title">等待审核</h2>
                    <p class="approval-text">
                        您的账号已提交，正在等待管理员审核。<br>
                        审核通过后，您将可以使用完整功能。
                    </p>
                    <p class="approval-email" id="approvalEmail"></p>
                    <button class="btn-secondary btn-large" onclick="location.href='index.html'">
                        返回首页
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check if already logged in
            if (isLoggedIn()) {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('loginForm').addEventListener('submit', handleLogin);
        });

        function handleLogin(e) {
            e.preventDefault();

            const email = document.getElementById('emailInput').value.trim();
            const inviteCode = document.getElementById('inviteCodeInput').value.trim();

            if (!email) {
                alert('请输入邮箱地址');
                return;
            }

            // Validate email format
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('请输入有效的邮箱地址');
                return;
            }

            // Simulate login/registration
            if (inviteCode) {
                // With invite code - direct login
                if (validateInviteCode(inviteCode)) {
                    performLogin(email, true);
                } else {
                    alert('邀请码无效，请检查后重试');
                }
            } else {
                // Without invite code - pending approval
                submitForApproval(email);
            }
        }

        function validateInviteCode(code) {
            // Simulate invite code validation
            // In real implementation, this would call API
            const validCodes = ['WELCOME2024', 'BETA123', 'INVITE001'];
            return validCodes.includes(code.toUpperCase());
        }

        function performLogin(email, approved) {
            // Save login state
            const user = {
                email: email,
                approved: approved,
                loginTime: new Date().toISOString()
            };

            localStorage.setItem('user', JSON.stringify(user));

            // Redirect to previous page or home
            const returnUrl = new URLSearchParams(window.location.search).get('return') || 'index.html';
            window.location.href = returnUrl;
        }

        function submitForApproval(email) {
            // Save pending state
            const user = {
                email: email,
                approved: false,
                pending: true,
                submitTime: new Date().toISOString()
            };

            localStorage.setItem('user', JSON.stringify(user));

            // Show approval message
            document.querySelector('.login-card').style.display = 'none';
            document.getElementById('approvalCard').style.display = 'block';
            document.getElementById('approvalEmail').textContent = `邮箱：${email}`;
        }
    </script>
</body>
</html>
