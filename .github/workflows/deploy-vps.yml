name: Deploy VPS

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: grammar_study
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d grammar_study"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.1

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install api dependencies
        run: python -m pip install -e "apps/api[dev]"

      - name: Run checks
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/grammar_study
          MODEL_PROVIDER: stub
        run: |
          pnpm --dir apps/web lint
          pnpm --dir apps/web typecheck
          python -m ruff check apps/api/app apps/api/tests
          python -m pytest apps/api/tests -q

  build-and-deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image names
        shell: bash
        run: |
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "API_IMAGE=${IMAGE_PREFIX}-api:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=${IMAGE_PREFIX}-web:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api/v1
          tags: ${{ env.WEB_IMAGE }}

      - name: Prepare VPS directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            mkdir -p "${{ secrets.VPS_DEPLOY_PATH }}"
            mkdir -p "${{ secrets.VPS_DEPLOY_PATH }}/deploy"

      - name: Copy production deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          source: "docker-compose.image.prod.yml,deploy/nginx.prod.conf"
          target: ${{ secrets.VPS_DEPLOY_PATH }}

      - name: Deploy images on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            cat > .env.production <<'EOF'
            ${{ secrets.PRODUCTION_ENV }}
            API_IMAGE=${{ env.API_IMAGE }}
            WEB_IMAGE=${{ env.WEB_IMAGE }}
            EOF
            if [ -n "${{ secrets.GHCR_READ_TOKEN }}" ] && [ -n "${{ secrets.GHCR_USERNAME }}" ]; then
              printf '%s' "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            fi
            docker compose --env-file .env.production -f docker-compose.image.prod.yml pull
            docker compose --env-file .env.production -f docker-compose.image.prod.yml up -d
            docker image prune -f
