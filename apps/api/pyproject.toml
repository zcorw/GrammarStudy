[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grammar-study-api"
version = "0.1.0"
description = "FastAPI starter package for grammar study"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.18,<1.19",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "openai>=1.107,<2.0",
  "PyJWT>=2.10,<3.0",
  "pydantic-settings>=2.8,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.13,<0.14"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
